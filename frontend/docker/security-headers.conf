# -----------------------------------------------------------------------------
# En-têtes de sécurité, inclus dans CHAQUE « location » de nginx.conf.
# Pourquoi pas une seule fois dans « server » ? En Nginx, un add_header écrit dans une
# location annule tous ceux hérités du bloc server : il faut donc les répéter.
# « always » : envoyés aussi sur les réponses d'erreur (404…).
# -----------------------------------------------------------------------------

# Interdit au navigateur de deviner le type d'un fichier autrement que par Content-Type.
add_header X-Content-Type-Options "nosniff" always;
# Interdit d'afficher le site dans une iframe d'un autre site (protection contre le « clickjacking »).
add_header X-Frame-Options "DENY" always;
# N'envoie pas l'adresse de la page aux autres sites : l'URL de retour de Keycloak
# (?code=…&state=…) ne doit pas fuiter.
add_header Referrer-Policy "no-referrer" always;
