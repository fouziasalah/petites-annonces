# -----------------------------------------------------------------------------
# Configuration Nginx du front (copiée dans /etc/nginx/conf.d/default.conf par le Dockerfile).
# -----------------------------------------------------------------------------
server {
    # Port d'écoute dans le conteneur (image « unprivileged » : pas de port < 1024).
    listen 8080;
    # Accepte toutes les adresses (localhost, nom de domaine…).
    server_name _;
    # Dossier des fichiers compilés d'Angular.
    root /usr/share/nginx/html;
    # Masque la version de Nginx dans les en-têtes de réponse.
    server_tokens off;

    # /config.json : généré au démarrage par 40-generer-config.sh à partir des variables
    # d'environnement. « alias » sert ce fichier à la place de celui du dossier root.
    location = /config.json {
        alias /tmp/app-config/config.json;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        # Jamais mis en cache : après un changement de variables, le navigateur doit relire le fichier.
        add_header Cache-Control "no-store" always;
    }

    # Fichiers JS/CSS/images : leur nom contient une empreinte (main-Y7DXSICD.js) qui change à
    # chaque version ; on peut donc les garder en cache un an sans risque.
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # =404 : fichier absent → erreur 404 (pas de renvoi vers index.html).
        try_files $uri =404;
    }

    # Toutes les autres URL (/annonces, /moderation…) : on renvoie index.html et c'est le
    # routeur Angular qui affiche le bon écran (« application monopage »).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # no-cache : le navigateur revérifie index.html à chaque visite (nouvelle version visible tout de suite).
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
