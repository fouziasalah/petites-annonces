# =============================================================================
# PetitesAnnonces — orchestration des services
#
#   cp .env.example .env && docker compose up -d --build
#
# Ports publiés (et RIEN d'autre) : 4200 (front), 8080 (Kong), 8180 (Keycloak).
# Ils sont liés à ${BIND_ADDRESS} (127.0.0.1 par défaut) : sur une VM, Docker
# contourne ufw, donc publier sur 0.0.0.0 exposerait réellement ces ports.
# =============================================================================
name: petitesannonces

# -----------------------------------------------------------------------------
# Deux réseaux :
#  - public   : ce que le navigateur atteint (via les ports publiés).
#  - internal : le « back-office » ; internal: true = aucune route vers l'extérieur
#               (pas d'accès Internet, pas de publication de port possible).
#               backend et postgres n'existent QUE sur ce réseau → inatteignables
#               depuis l'hôte (DEP-02). Kong et Keycloak sont sur les deux.
# -----------------------------------------------------------------------------
networks:
  public:
  internal:
    internal: true

volumes:
  postgres-data:

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 : bases « keycloak » et « annonces » (postgres/init.sql)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      # Lus par init.sql via \getenv (uniquement au premier démarrage)
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      ANNONCES_DB_PASSWORD: ${ANNONCES_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
    healthcheck:
      # -h 127.0.0.1 force une connexion TCP : pendant l'initialisation, l'image
      # lance un serveur temporaire SANS écoute TCP. Un pg_isready par socket
      # Unix répondrait « prêt » trop tôt et Keycloak échouerait à se connecter.
      # -d annonces : la dernière base créée par init.sql existe.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "annonces"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Keycloak : Identity Provider (realm importé depuis keycloak/realm-annonces.json)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    # --import-realm : importe /opt/keycloak/data/import/*.json SI le realm n'existe
    # pas encore en base. Sur un volume existant, le JSON est ignoré.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      # URL publique de Keycloak, celle du NAVIGATEUR. Elle fixe le claim « iss » :
      # iss = ${KC_PUBLIC_URL}/realms/annonces (et non http://keycloak:8080/...).
      KC_HOSTNAME: ${KC_PUBLIC_URL:?}
      KC_HTTP_ENABLED: "true"
      # Expose /health/ready sur le port de management 9000 (non publié).
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?}
      # Valeurs substituées dans les placeholders ${...} du realm à l'import.
      # Noms sans préfixe KC_ : ce préfixe est réservé aux options de Keycloak.
      FRONT_PUBLIC_URL: ${FRONT_PUBLIC_URL:?}
      REALM_PWD_ALICE: ${REALM_PWD_ALICE:?}
      REALM_PWD_BOB: ${REALM_PWD_BOB:?}
      REALM_PWD_MODO: ${REALM_PWD_MODO:?}
      REALM_PWD_ADMIN: ${REALM_PWD_ADMIN:?}
      REALM_RSA_PRIVATE_KEY: ${REALM_RSA_PRIVATE_KEY:?lancer scripts/gen-keys.sh}
      REALM_RSA_CERTIFICATE: ${REALM_RSA_CERTIFICATE:?lancer scripts/gen-keys.sh}
    volumes:
      - ./keycloak/realm-annonces.json:/opt/keycloak/data/import/realm-annonces.json:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8180:8080"
    networks: [public, internal]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # L'image Keycloak ne contient ni curl ni wget : on ouvre une connexion TCP
      # avec la pseudo-redirection bash /dev/tcp et on écrit la requête HTTP à la main.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Backend Spring Boot : réseau internal UNIQUEMENT, aucun port publié.
  # Seule la gateway peut l'appeler (DEP-02).
  # ---------------------------------------------------------------------------
  backend:
    build: ./backend
    # En local : construite par --build. Sur la VM : tirée de Docker Hub (pull, --no-build).
    image: ${DOCKERHUB_USERNAME:-local}/petitesannonces-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/annonces
      SPRING_DATASOURCE_USERNAME: annonces
      SPRING_DATASOURCE_PASSWORD: ${ANNONCES_DB_PASSWORD:?}
      # DEBUG : trace des headers reçus de Kong (GW-08).
      SECURITY_LOG_LEVEL: ${SECURITY_LOG_LEVEL:-DEBUG}
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # wget est fourni par busybox dans l'image Alpine ; /actuator/health n'exige pas d'identité.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Gateway Kong OSS, DB-less : seul point d'entrée de l'API.
  # ---------------------------------------------------------------------------
  gateway:
    image: kong:3.9.4
    restart: unless-stopped
    # Avant de lancer Kong, on produit la config finale à partir de kong/kong.yml
    # et de .env (URLs, clé publique du realm), puis on rend la main au script
    # de démarrage officiel de l'image.
    entrypoint:
      - /bin/sh
      - -c
      - /kong-src/render-config.sh /kong-src/kong.yml /tmp/kong.yml && exec /docker-entrypoint.sh kong docker-start
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      # bundled = plugins officiels OSS ; identity-headers = notre plugin Lua.
      KONG_PLUGINS: bundled,identity-headers
      # Le plugin est cherché sous kong.plugins.identity-headers.* : ce chemin
      # Lua fait correspondre ce nom au dossier monté ci-dessous.
      KONG_LUA_PACKAGE_PATH: /usr/local/kong/custom/?.lua;;
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      # Admin API limitée à la boucle locale DU CONTENEUR et jamais publiée (GW-10).
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      # Lus par render-config.sh
      FRONT_PUBLIC_URL: ${FRONT_PUBLIC_URL:?}
      KC_PUBLIC_URL: ${KC_PUBLIC_URL:?}
      REALM_RSA_PUBLIC_KEY: ${REALM_RSA_PUBLIC_KEY:?lancer scripts/gen-keys.sh}
    volumes:
      - ./kong:/kong-src:ro
      - ./kong/plugins/identity-headers:/usr/local/kong/custom/kong/plugins/identity-headers:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8000"
    networks: [public, internal]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
