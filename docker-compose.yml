# =============================================================================
# Services de PetitesAnnonces (cahier des charges § 3 et § 6.2) :
#   frontend  Angular servi par Nginx        http://localhost:4200
#   gateway   Kong, point d'entrée de l'API  http://localhost:8080/api/…
#   keycloak  gestion des comptes et tokens  http://localhost:8180/admin
#   backend   API Spring Boot                non exposé (joignable via la gateway)
#   postgres  bases keycloak et annonces     non exposé
#
# Commandes (à la racine du projet) :
#   docker compose up -d --wait     démarre les services et attend qu'ils soient prêts
#   docker compose ps               état des services
#   docker compose logs -f keycloak logs en direct
#   docker compose down             arrête (les données sont CONSERVÉES dans le volume)
#   docker compose down -v          arrête et EFFACE les données (bases et config Keycloak)
#
# Variables d'environnement : chaque ${NOM:-valeur} prend la valeur de la variable NOM si
# elle existe (dans le terminal ou dans un fichier .env à côté de ce fichier), sinon la
# valeur après « :- ». Les valeurs par défaut ci-dessous sont des valeurs de DÉVELOPPEMENT.
#   POSTGRES_PASSWORD            mot de passe de l'administrateur PostgreSQL
#   KEYCLOAK_DB_PASSWORD         mot de passe de l'utilisateur « keycloak » de la base
#   ANNONCES_DB_PASSWORD         mot de passe de l'utilisateur « annonces » (celui du backend)
#   KC_BOOTSTRAP_ADMIN_USERNAME  identifiant de l'administrateur Keycloak
#   KC_BOOTSTRAP_ADMIN_PASSWORD  mot de passe de l'administrateur Keycloak
#
# Adresse de l'application (exportées par la pipeline lors du déploiement sur la VM) :
#   PUBLIC_HOST         hôte de base de TOUTES les URLs vues par le navigateur
#                       (localhost en local, IP de la VM en déploiement)
#   BIND_ADDRESS        interface où les ports sont publiés : 127.0.0.1 = ta machine seulement,
#                       0.0.0.0 = accessible depuis Internet
#   REALM_SSL_REQUIRED  HTTPS exigé par le realm : « external » refuse le HTTP depuis une
#                       adresse publique ; « none » l'autorise (VM sans HTTPS)
# =============================================================================

# Nom du projet : préfixe des conteneurs, du réseau et du volume (petitesannonces-postgres-1…).
name: petitesannonces

# Deux réseaux Docker (§ 3.1) :
#  - public   : services que le navigateur atteint par un port publié (frontend, gateway, keycloak) ;
#  - internal : réseau privé sans accès extérieur (internal: true) où vivent backend et postgres.
#    gateway et keycloak sont sur les deux : la gateway pour joindre le backend, keycloak pour
#    joindre sa base. Le navigateur ne peut donc JAMAIS appeler le backend directement.
networks:
  public:
  internal:
    internal: true

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 : bases « keycloak » et « annonces » (créées par postgres/init.sql)
  # ---------------------------------------------------------------------------
  postgres:
    # Image officielle, version épinglée (16.15) : le même code donne toujours le même résultat.
    image: postgres:16.15-alpine
    # Redémarre automatiquement le conteneur s'il s'arrête (sauf arrêt volontaire).
    restart: unless-stopped
    environment:
      # Mot de passe de l'administrateur « postgres » (obligatoire pour l'image officielle).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres}
      # Lus par init.sql (commande \getenv) au premier démarrage.
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dev-keycloak-db}
      ANNONCES_DB_PASSWORD: ${ANNONCES_DB_PASSWORD:-dev-annonces-db}
    volumes:
      # Volume nommé : les données survivent à « docker compose down » (pas à « down -v »).
      - postgres-data:/var/lib/postgresql/data
      # Script d'initialisation, monté en lecture seule (:ro).
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
    # Pas de « ports » : la base n'est joignable que par les autres conteneurs (backend,
    # keycloak), sous le nom « postgres ». Elle n'est pas exposée sur ta machine.
    # Vérification de l'état du service, utilisée par « depends_on » et « --wait ».
    healthcheck:
      # pg_isready (fourni dans l'image) : la base accepte-t-elle les connexions ?
      # -h 127.0.0.1 force une connexion réseau : pendant l'initialisation, PostgreSQL démarre
      # un serveur temporaire sans réseau ; sans cette option, il serait déclaré prêt trop tôt.
      # -d annonces : vérifie aussi que la dernière base créée par init.sql existe.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "annonces"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Keycloak : gestion des comptes et émission des tokens (console : http://localhost:8180/admin)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    # start-dev : mode développement (HTTP autorisé, caches simplifiés). En production : « start ».
    # --import-realm : importe keycloak/realm-annonces.json au démarrage, SI le realm n'existe
    # pas encore dans la base (§ 6.4). Voir keycloak/README.md.
    command: ["start-dev", "--import-realm"]
    environment:
      # Base de données de Keycloak : la base « keycloak » du service postgres.
      # « postgres » est le nom du service : Docker Compose le résout en adresse réseau.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dev-keycloak-db}
      # URL de Keycloak telle que le NAVIGATEUR la voit. Elle sert d'émetteur (« iss ») dans
      # les tokens : http://localhost:8180/realms/annonces (et non http://keycloak:8080/…).
      KC_HOSTNAME: http://${PUBLIC_HOST:-localhost}:8180
      KC_HTTP_ENABLED: "true"
      # Active /health/ready sur le port de management 9000 (utilisé par le healthcheck).
      KC_HEALTH_ENABLED: "true"
      # Compte administrateur créé au premier démarrage (realm « master »).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-dev-kcadmin}
      # Valeurs des placeholders ${…} de realm-annonces.json, lues dans le fichier .env
      # (cp .env.example .env). « :? » : Compose refuse de démarrer si la variable manque.
      REALM_PWD_ALICE: ${REALM_PWD_ALICE:?définir dans .env}
      REALM_PWD_BOB: ${REALM_PWD_BOB:?définir dans .env}
      REALM_PWD_MODO: ${REALM_PWD_MODO:?définir dans .env}
      REALM_PWD_ADMIN: ${REALM_PWD_ADMIN:?définir dans .env}
      REALM_RSA_PRIVATE_KEY: ${REALM_RSA_PRIVATE_KEY:?lancer scripts/gen-keys.sh}
      REALM_RSA_CERTIFICATE: ${REALM_RSA_CERTIFICATE:?lancer scripts/gen-keys.sh}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      REALM_SSL_REQUIRED: ${REALM_SSL_REQUIRED:-external}
    volumes:
      # Fichier du realm, monté en lecture seule dans le dossier d'import de Keycloak.
      - ./keycloak/realm-annonces.json:/opt/keycloak/data/import/realm-annonces.json:ro
    ports:
      # Port 8180 de la machine → port 8080 du conteneur, sur l'interface BIND_ADDRESS.
      - "${BIND_ADDRESS:-127.0.0.1}:8180:8080"
    networks: [public, internal]
    # Keycloak ne démarre qu'une fois PostgreSQL déclaré en bonne santé.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # L'image Keycloak ne contient ni curl ni wget : on ouvre une connexion TCP avec bash
      # (/dev/tcp), on écrit la requête HTTP à la main et on cherche « UP » dans la réponse.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Backend Spring Boot : réseau internal uniquement, AUCUN port publié (§ 2 et § 3.1).
  # Seule la gateway l'appelle, avec les en-têtes X_USER_ID / X_ROLE_ID.
  # ---------------------------------------------------------------------------
  backend:
    # En local : construite à partir de backend/Dockerfile (docker compose up --build).
    # Sur la VM : téléchargée depuis Docker Hub (docker compose pull), poussée par la CI/CD.
    build: ./backend
    image: ${DOCKERHUB_USERNAME:-local}/petitesannonces-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Variables lues par application.yml.
    environment:
      # « postgres » : nom du service PostgreSQL ci-dessus.
      DB_HOST: postgres
      DB_PASSWORD: ${ANNONCES_DB_PASSWORD:-dev-annonces-db}
      # DEBUG : chaque requête affiche dans les logs les en-têtes reçus de la gateway (§ 6.7).
      # Voir : docker compose logs -f backend
      SECURITY_LOG_LEVEL: DEBUG
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # wget est fourni par l'image Alpine ; /actuator/health ne demande pas d'identité.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Gateway Kong OSS en mode DB-less (§ 6.5) : seul point d'entrée de l'API.
  # Vérifie le token, le remplace par X_USER_ID / X_ROLE_ID, limite à 3 appels/minute.
  # ---------------------------------------------------------------------------
  gateway:
    # Image officielle, utilisée sans construction : la configuration est montée en volume.
    image: kong:3.9.4
    restart: unless-stopped
    environment:
      # DB-less : pas de base de données, configuration lue dans le fichier ci-dessous.
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      # Plugins activés : ceux fournis avec Kong (« bundled ») + notre plugin Lua.
      KONG_PLUGINS: bundled,identity-headers
      # Où Lua cherche les plugins : « kong.plugins.identity-headers » correspond au dossier
      # /usr/local/kong/custom/kong/plugins/identity-headers (monté ci-dessous).
      KONG_LUA_PACKAGE_PATH: /usr/local/kong/custom/?.lua;;
      # Port du proxy (celui qui reçoit les appels du front).
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      # API d'administration de Kong : limitée au conteneur lui-même, jamais publiée (§ 2).
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
    # kong.yml est écrit pour localhost. Au démarrage, sed en fait une copie (/tmp/kong.yml) où
    # « http://localhost: » devient « http://PUBLIC_HOST: » (origine CORS et émetteur des
    # tokens), puis lance Kong avec la commande d'origine de l'image.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        sed 's|http://localhost:|http://${PUBLIC_HOST:-localhost}:|g' /kong/kong.yml > /tmp/kong.yml &&
        exec /docker-entrypoint.sh kong docker-start
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
      - ./kong/plugins/identity-headers:/usr/local/kong/custom/kong/plugins/identity-headers:ro
    ports:
      # Port 8080 de la machine → port 8000 du proxy Kong (§ 3.1).
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8000"
    # public : joignable par le navigateur ; internal : pour joindre le backend.
    networks: [public, internal]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Commande fournie par Kong : vérifie que Kong fonctionne.
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Frontend Angular servi par Nginx (application : http://localhost:4200)
  # ---------------------------------------------------------------------------
  frontend:
    # Même principe que le backend : construite en local, téléchargée sur la VM.
    build: ./frontend
    image: ${DOCKERHUB_USERNAME:-local}/petitesannonces-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Écrites dans /config.json au démarrage : URLs vues par le NAVIGATEUR.
    environment:
      KEYCLOAK_URL: http://${PUBLIC_HOST:-localhost}:8180
      # Le front appelle l'API UNIQUEMENT via la gateway Kong (jamais le backend directement).
      GATEWAY_URL: http://${PUBLIC_HOST:-localhost}:8080
    ports:
      # Port 4200 de la machine → port 8080 de Nginx dans le conteneur.
      - "${BIND_ADDRESS:-127.0.0.1}:4200:8080"
    networks: [public]
    depends_on:
      keycloak:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6

# Déclaration du volume nommé utilisé par postgres.
volumes:
  postgres-data:
