# =============================================================================
# Intégration continue (CI) de PetitesAnnonces, exécutée par GitHub Actions.
#
# Quand ? À chaque push sur la branche main et à chaque pull request.
# Où voir le résultat ? Onglet « Actions » du dépôt GitHub.
#
# 4 jobs, exécutés EN PARALLÈLE sur des machines virtuelles Ubuntu fournies par GitHub :
#   backend         compilation + tests (unitaires et d'intégration sur un vrai PostgreSQL)
#   frontend        lint, tests unitaires, build de production Angular
#   image-frontend  construction de l'image Docker du front et test de ses variables
#   infra           démarrage de docker-compose.yml (PostgreSQL + Keycloak)
# =============================================================================

# Nom affiché dans l'onglet Actions.
name: CI

# Déclencheurs du workflow.
on:
  push:
    branches: [main]
  pull_request:

# Droits du jeton GitHub fourni au workflow : lecture seule du dépôt (moindre privilège).
permissions:
  contents: read

# Si un nouveau push arrive sur la même branche, l'exécution précédente est annulée.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Maven + Testcontainers)
    # Machine virtuelle Ubuntu ; Docker y est installé, ce dont Testcontainers a besoin.
    runs-on: ubuntu-latest
    # Toutes les commandes « run » de ce job s'exécutent dans le dossier backend.
    defaults:
      run:
        working-directory: backend
    steps:
      # Récupère le code du dépôt sur la machine.
      - uses: actions/checkout@v7

      # Installe Java 21 (distribution Temurin) et met en cache les dépendances Maven
      # (~/.m2) : les exécutions suivantes ne les retéléchargent pas.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify : compile, lance les tests unitaires (*Test) puis les tests d'intégration (*IT).
      # -B (batch) : sortie sans couleurs ni animations, adaptée aux logs.
      - name: Compilation et tests
        run: ./mvnw -B verify

      # Rapports de tests téléchargeables depuis la page du run (onglet Summary → Artifacts).
      # if: always() : exécuté même si les tests ont échoué, pour pouvoir lire les erreurs.
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests-backend
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Installe Node 24 et met en cache le dossier de cache npm.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci : installe exactement les versions du package-lock.json.
      - name: Installation des dépendances
        run: npm ci --no-audit --no-fund

      # ESLint : règles de qualité et bonnes pratiques Angular.
      - name: Lint
        run: npx ng lint

      # Tests unitaires (Vitest) ; --watch=false : une seule exécution puis arrêt.
      - name: Tests unitaires
        run: npx ng test --watch=false

      - name: Build de production
        run: npx ng build --configuration production

  # ---------------------------------------------------------------------------
  image-frontend:
    name: Image Docker du front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construction de l'image
        run: docker build -t petitesannonces-frontend:ci frontend

      # On démarre l'image avec des variables d'environnement personnalisées et on vérifie
      # qu'elles se retrouvent bien dans /config.json.
      - name: Démarrage avec des variables d'environnement
        run: |
          docker run -d --name front -p 8080:8080 \
            -e KEYCLOAK_URL=https://auth.exemple.test \
            -e GATEWAY_URL=https://api.exemple.test \
            petitesannonces-frontend:ci
          # Attend que Nginx réponde (au plus 30 secondes).
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ > /dev/null && break; sleep 1; done

      - name: Vérification de config.json et du routage Angular
        run: |
          set -x
          curl -sf http://localhost:8080/config.json | tee config.json
          grep -q '"keycloakUrl": "https://auth.exemple.test"' config.json
          grep -q '"gatewayUrl": "https://api.exemple.test"' config.json
          # Une URL interne à Angular doit renvoyer index.html (code 200).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/annonces/42)" = 200

      - name: Logs du conteneur
        if: always()
        run: docker logs front

  # ---------------------------------------------------------------------------
  infra:
    name: Infrastructure (PostgreSQL + Keycloak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Vérifie la syntaxe de docker-compose.yml.
      - name: Validation de docker-compose.yml
        run: docker compose config --quiet

      # --wait : attend que tous les services soient « healthy » (au plus 5 minutes).
      - name: Démarrage des services
        run: docker compose up -d --wait --wait-timeout 300

      - name: Vérifications
        run: |
          set -x
          # Les deux bases créées par postgres/init.sql existent, chacune avec son propriétaire.
          docker compose exec -T postgres psql -U postgres -tAc \
            "select datname || ' -> ' || pg_get_userbyid(datdba) from pg_database where datname in ('keycloak', 'annonces')" \
            | tee bases.txt
          grep -q 'keycloak -> keycloak' bases.txt
          grep -q 'annonces -> annonces' bases.txt
          # Keycloak répond et annonce le bon émetteur pour son realm d'administration.
          curl -sf http://localhost:8180/realms/master/.well-known/openid-configuration \
            | grep -q '"issuer":"http://localhost:8180/realms/master"'

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --tail 100

      # Toujours exécuté : arrête les services et supprime leurs données.
      - name: Arrêt
        if: always()
        run: docker compose down -v
